schema_version: "0.3"
catalog_kind: proposed_content_factory_component_index
owner: Bronson-Technologies
namespace: nanogarden-org
components:
  - id: bobw
    name: B.o.B.W. — Best of BOTH Worlds
    version: 0.3.0
    department: ingestion
