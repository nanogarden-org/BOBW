# Indexing plan, not authorization to split or relocate the owner's corpus.
future_index_fields:
  - component_id
  - actual_repository_url
  - version_or_commit
  - inputs_and_outputs
  - contract_version
  - owning_department
  - maturity_and_evidence
  - archive_location
