[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobw"
version = "0.1.0"
description = "Provenance-preserving dual ingestion reference architecture"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
bobw = "bobw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
