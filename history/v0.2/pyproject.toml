[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobw"
version = "0.2.0"
description = "B.o.B.W. ingestion department: provenance-preserving customs and warehouse sorting"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
bobw = "bobw.cli:main"
bobw-intake = "bobw.department:main"

[tool.setuptools.packages.find]
where = ["src"]
